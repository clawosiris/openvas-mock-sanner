name: CI

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - devel
  push:
    branches:
      - main
      - devel
      - "feature/**"
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/clawosiris/openvas-mock-scanner

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out scan-examples
        uses: actions/checkout@v4
        with:
          repository: clawosiris/scan-examples
          path: scan-examples

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Run unit and contract tests
        env:
          SCAN_EXAMPLES_PATH: ${{ github.workspace }}/scan-examples
        run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openvas-mock-scanner:ci

      - name: Smoke test image
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 18080:80 \
            -e MOCK_SCENARIO=success-basic \
            -e LISTENING=0.0.0.0:80 \
            openvas-mock-scanner:ci)"
          trap 'docker rm -f "$cid"' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:18080/health/alive', timeout=2)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$cid"
            exit 1
          fi

          python - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:18080"
          request = urllib.request.Request(
              f"{base}/scans",
              data=json.dumps({
                  "scan_id": "ci-smoke",
                  "target": {"hosts": ["127.0.0.1"], "ports": []},
                  "vts": [],
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          scan_id = json.load(urllib.request.urlopen(request, timeout=2))
          assert scan_id == "ci-smoke"

          action = urllib.request.Request(
              f"{base}/scans/ci-smoke",
              data=b'{"action":"start"}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          assert urllib.request.urlopen(action, timeout=2).status == 204
          status = json.load(urllib.request.urlopen(f"{base}/scans/ci-smoke/status", timeout=2))
          assert status["status"] == "running"
          results = json.load(urllib.request.urlopen(f"{base}/scans/ci-smoke/results?range=0-1", timeout=2))
          assert len(results["items"]) == 2
          PY


      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
